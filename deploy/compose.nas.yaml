# NAS 正式入口由 homelab-services 的 home project include；复用共享 PG17，不创建第二个常驻数据库。
# 私有连接文件只在 NAS 运行目录，固定镜像已通过独立 Go/Core 与真实 Web 验证。
x-pokemon-runtime: &pokemon-runtime
  image: pokemon-go-server:p6-sv-filesystem-r1
  pull_policy: never
  env_file: /volume2/docker/pokemon-battle-inference/settings.env
  restart: always
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216"]
  mem_limit: 1g
  stop_grace_period: 30s
  networks: [pokemon_net, database_net]

services:
  pokemon-backend:
    <<: *pokemon-runtime
    environment:
      PBI_LISTEN: 0.0.0.0:41104
      PBI_SPRITES_ROOT: /sprites-storage
    volumes:
      - type: bind
        source: /volume1/docker/pokemon-battle-inference/sprite-snapshots
        target: /sprites-storage
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/local/bin/pbi-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
  pokemon-worker:
    <<: *pokemon-runtime
    entrypoint: [/usr/local/bin/pbi-worker]
    command: [-revision, battle-inference.summary-exploration.v2]
    healthcheck:
      disable: true
  pokemon-frontend:
    image: pokemon-go-frontend:p6-sv-filesystem-r1
    pull_policy: never
    restart: always
    read_only: true
    cap_drop: [ALL]
    # Nginx 绑定容器内80并以非root worker读取静态文件所需的精确能力。
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/run:rw,noexec,nosuid,nodev,size=1048576
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=67108864
    mem_limit: 256m
    ports: ["127.0.0.1:41110:80"]
    depends_on:
      pokemon-backend:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./nginx.nas.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../ios/Sources/PokemonAppSupport/Resources/knowledge.sqlite
        target: /usr/share/nginx/knowledge/knowledge.sqlite
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../ios/Sources/PokemonAppSupport/Resources/manifest.json
        target: /usr/share/nginx/knowledge/manifest.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../ios/Sources/PokemonAppSupport/Resources/POKEAPI-LICENSE.txt
        target: /usr/share/nginx/knowledge/POKEAPI-LICENSE.txt
        read_only: true
        bind: {create_host_path: false}
    networks: [pokemon_net]
  pokemon-db-init:
    profiles: [maintenance]
    image: pokemon-go-data:p6-sv-filesystem-r1
    pull_policy: never
    env_file: /volume2/docker/pokemon-battle-inference/settings.env
    command: [--csv-root, /usr/share/pbi/csv, --adopt-legacy-knowledge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    networks: [database_net]
    volumes:
      - type: bind
        source: /volume1/docker/pokemon-battle-inference/sprite-snapshots
        target: /sprites-storage
        read_only: true
        bind: {create_host_path: false}

networks:
  pokemon_net:
    # 已检查宿主路由及Docker IPAM，与其他应用及本次验证网络无重叠。
    ipam:
      config: [{subnet: 10.245.24.80/28}]
  database_net:
    name: database_net
    external: true
