# NAS入口：Web与原生App共用同源API；不存在的知识包必须404，不能误返SPA首页。
server {
    listen 80;
    server_name pokemon.mental1104.xyz;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://pokemon-backend:41104/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # 版本目录固定为实际数据版本；同目录manifest与sqlite可由原生客户端校验并原子安装。
    location /knowledge/pokeapi-1567d53073a0-7e4be433ddb6/ {
        alias /usr/share/nginx/knowledge/;
        autoindex off;
        types { application/json json; application/vnd.sqlite3 sqlite; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /knowledge/ { return 404; }

    # 人工E项的同源验收版本，仅metadata版本标识不同；不是更新的PokeAPI事实数据。
    location /acceptance/knowledge/r1/ {
        alias /usr/share/nginx/knowledge-acceptance/;
        autoindex off;
        types { application/json json; application/vnd.sqlite3 sqlite; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }
    # 约400KiB的真实SQLite以4KiB/s发送，给实际取消/断网和Range续传留下观察窗口。
    location /acceptance/knowledge-slow/r1/ {
        alias /usr/share/nginx/knowledge-acceptance/;
        autoindex off;
        limit_rate 4k;
        types { application/json json; application/vnd.sqlite3 sqlite; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }
    # 负例仅替换清单摘要；同目录knowledge.sqlite仍是实际有效正文。
    location = /acceptance/knowledge-bad-sha/r1/manifest.json {
        alias /usr/share/nginx/knowledge-acceptance/manifest-bad-sha.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location /acceptance/knowledge-bad-sha/r1/ {
        alias /usr/share/nginx/knowledge-acceptance/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }
    location /acceptance/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
