# NAS入口：Web与原生App共用同源API；不存在的知识包必须404，不能误返SPA首页。
server {
    listen 80;
    server_name pokemon.mental1104.xyz;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://pokemon-backend:41104/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # 版本目录固定为实际数据版本；同目录manifest与sqlite可由原生客户端校验并原子安装。
    location /knowledge/pokeapi-1567d53073a0-7e4be433ddb6/ {
        alias /usr/share/nginx/knowledge/;
        autoindex off;
        types { application/json json; application/vnd.sqlite3 sqlite; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /knowledge/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
