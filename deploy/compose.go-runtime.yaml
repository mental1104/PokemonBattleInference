# Go/C++独立预览与后续发布配置；默认端口41110仅回环，不覆盖原Python Compose。
# 输入：固定源码、运行镜像标签、已准备的独占PG目录、完整只读sprites来源和已核对的子网。
# 初始化显式执行ops/db-init；普通down保留PG目录，不提供自动清空或生产切换入口。
x-go-environment: &go-environment
  PBI_POSTGRES_DSN: postgres://pokeop@postgres:5432/pokeop?sslmode=disable

x-go-runtime: &go-runtime
  image: ${PBI_GO_SERVER_IMAGE:-pokemon-go-server:preview}
  build:
    context: ${PBI_GO_SOURCE_ROOT:?Set the committed source checkout}
    dockerfile: deploy/Dockerfile.go
    target: server
  environment: *go-environment
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216"]
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy

services:
  frontend:
    image: ${PBI_GO_FRONTEND_IMAGE:-pokemon-go-frontend:preview}
    build:
      context: ${PBI_GO_SOURCE_ROOT:?Set the committed source checkout}
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PBI_GO_BIND:-127.0.0.1}:${PBI_GO_PORT:-41110}:80"
  backend:
    <<: *go-runtime
    environment:
      <<: *go-environment
      PBI_LISTEN: 0.0.0.0:41104
      PBI_SPRITES_ROOT: /sprites-storage
    volumes:
      - type: bind
        source: ${PBI_GO_SPRITES_ROOT:?Set the verified versioned HDD snapshot parent directory}
        target: /sprites-storage
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/local/bin/pbi-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
  worker:
    <<: *go-runtime
    entrypoint: [/usr/local/bin/pbi-worker]
    # 必须匹配原公开任务版本，否则Web得到202后会永久排队。
    command: [-revision, battle-inference.summary-exploration.v2]
    healthcheck:
      disable: true
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokeop
      POSTGRES_DB: pokeop
      # 与本文件的独占bind对应，避免外部Compose叠加时继承其他PGDATA目录。
      PGDATA: /var/lib/postgresql/data
      # PG不发布宿主端口，只允许本项目私有网络中的API/Worker/初始化器访问。
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      # initdb临时socket服务不能解锁db-init；正式TCP目标库必须已可执行SQL。
      test: [CMD, psql, -h, 127.0.0.1, -U, pokeop, -d, pokeop, -Atc, "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - type: bind
        source: ${PBI_GO_POSTGRES_ROOT:?Set the prepared owned PostgreSQL data directory}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
  db-init:
    profiles: [ops]
    image: ${PBI_GO_DATA_IMAGE:-pokemon-go-data:preview}
    build:
      context: ${PBI_GO_SOURCE_ROOT:?Set the committed source checkout}
      dockerfile: deploy/Dockerfile.go
      target: db-init
    environment: *go-environment
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${PBI_GO_SPRITES_ROOT:?Set the verified versioned HDD snapshot parent directory}
        target: /sprites-storage
        read_only: true
        bind:
          create_host_path: false
    # 完整28.7GB图库可显式增加初始化总时限；默认仍20分钟，不改变在线Core请求预算。
    command: [--csv-root, /usr/share/pbi/csv, --sprites-root, "/sprites-storage/${PBI_GO_SPRITES_COMMIT:?Set the verified sprites source commit}", --sprites-commit, "${PBI_GO_SPRITES_COMMIT}", --sprites-storage, filesystem, --timeout, "${PBI_GO_INIT_TIMEOUT:-20m}"]

networks:
  default:
    # 前端需要发布回环端口；API/PG不声明ports，仍只通过本项目网络访问。
    ipam:
      config:
        - subnet: ${PBI_GO_SUBNET:?Set a subnet checked against host routes and Docker IPAM}
