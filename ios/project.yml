# XcodeGen 是工程的唯一来源；本地 Swift Package 与 App 一起编译。
name: PokemonBattleInference
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
packages:
  PokemonCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/apple/$(PLATFORM_NAME)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PokemonBattleInference:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 宝可梦对战推演
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 连接您设置的局域网服务器进行在线计算和配置同步。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mental1104.PokemonBattleInference
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.7.0
    dependencies:
      - package: PokemonCore
        product: PokemonAppSupport
      - package: PokemonCore
        product: PokemonCore
  PokemonAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mental1104.PokemonBattleInference.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PokemonBattleInference
    dependencies:
      - target: PokemonBattleInference
schemes:
  PokemonBattleInference:
    build:
      targets:
        PokemonBattleInference: all
        PokemonAppUITests: [test]
    test:
      gatherCoverageData: false
      targets: [PokemonAppUITests]
