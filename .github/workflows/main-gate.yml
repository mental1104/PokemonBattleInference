name: Main Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-target:
    name: Validate target ref
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require main target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${GITHUB_BASE_REF}" != "main" ]]; then
              echo "::error::Pull request gate only supports the main target."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Main Gate can only run against main."
            exit 1
          fi

  test:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 开发者仍可在 .gitmodules 中使用 SSH；Hosted Runner 没有仓库 SSH key，
      # 因此只在当前 CI checkout 中把所需子模块的传输地址覆盖为 HTTPS。
      - name: Initialize required submodules
        run: |
          git config submodule.submodules/common.url https://github.com/mental1104/common.git
          git config submodule.submodules/pokeapi.url https://github.com/PokeAPI/pokeapi.git
          git submodule update --init --depth 1 submodules/common submodules/pokeapi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet --upgrade pip
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Run backend tests
        run: |
          set -o pipefail
          python -m pytest tests -q -x --tb=short 2>&1 | tee pytest.log

      - name: Upload backend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-${{ github.run_id }}
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Upload frontend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-${{ github.run_id }}
          path: web/frontend-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend
        working-directory: web
        run: npm run build

  notify-manual-failure:
    name: Notify manual failure
    needs: [validate-target, test]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[CI Failed] ${{ github.repository }} main manual gate"
          body: |
            main 分支手动门禁执行失败。

            仓库：${{ github.repository }}
            提交：${{ github.sha }}
            执行人：${{ github.actor }}
            运行地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
