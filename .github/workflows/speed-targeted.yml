name: Speed Goal Targeted

on:
  pull_request:
    branches: [main]

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required submodules
        run: |
          git config submodule.submodules/common.url https://github.com/mental1104/common.git
          git config submodule.submodules/pokeapi.url https://github.com/PokeAPI/pokeapi.git
          git submodule update --init --depth 1 submodules/common submodules/pokeapi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt
      - name: Run targeted backend tests
        run: |
          python -m pytest \
            tests/application/use_cases/test_configuration_speed_goals.py \
            tests/api/test_configuration_speed_goal_router.py \
            tests/api/test_configuration_solver_router.py \
            tests/api/test_configuration_spread_search_router.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run targeted frontend tests
        working-directory: web
        run: npm test -- --run src/composables/useConfigurationSolver.speed.test.ts src/composables/useConfigurationSolver.test.ts src/views/ConfigurationSolverView.test.ts
      - name: Build frontend
        working-directory: web
        run: npm run build
